<title>界面重画 · 核心流程高保真可点原型（抛弃式 · #57）</title>
<!--
  PROTOTYPE ONLY — 一次性产物，不是产品代码。
  问题：一屏两栏的核心流程在真手机上点起来是否成立；41 个「不常见但一定会出现」的状态是否都有入口。
  输入：design-brief.md（需求与验收）、visual-spec.md（纸页感 token）。
  单文件、零外部依赖、离线可开。数据本地生成（905 篇 / 197 篇大目录 / 四层路径），不连真仓库。
  骨架只建一次：#search-input / #editor-input / #dialog-input / #unlock-input 四个输入节点全程不替换。
-->
<script>
  /* 主题定色必须在样式之前：深色用户第一帧不许是白的。
     与主程序（设置面板）各读一次同一份记录，两处留镜像注释。 */
  (() => {
    let p = 'system';
    try { p = localStorage.getItem('gitobsidianlite.theme') || 'system'; } catch (_) {}
    const dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  })();
</script>

#笔记系统 #移动端

## 为什么不再整库同步

手机上最常做的其实是「看一眼、改一句」。为这一句把九百多篇全拉下来，地铁里等半天，最后还经常卡在冲突上。电脑上继续用本地库高频改，手机只做低频的补充。

> 弱网与随时切走是常态，界面必须随时说清「你看到的是真的，还是还不知道」。

function layout() { return (S.viewport === 'wide' || S.viewport === 'bp900') ? 'wide' : 'phone'; }

function render() {
  const ly = layout();
  const scr = $('screen');
  scr.dataset.layout = ly;
  scr.dataset.sideOpen = (S.sideOpen || (ly === 'wide' && !S.sideCollapsed)) ? 'true' : 'false';
  scr.dataset.sideCollapsed = String(S.sideCollapsed);
  document.documentElement.dataset.theme = themeResolved();
  document.documentElement.classList.toggle('show-tape', S.tape);

  // 顶栏
  $('btn-menu').innerHTML = svg('menu');
  $('btn-more').innerHTML = svg('more');
  $('exit-edit-btn').innerHTML = svg('back');
  $('btn-new').innerHTML = svg('new');
  $('btn-settings').innerHTML = svg('settings');
  $('btn-side-close').innerHTML = svg('close');
  $('btn-side-close').hidden = !S.sideOpen;
  $('btn-search-open').innerHTML = svg('search');
  $('btn-clear').innerHTML = svg('clear');
  $('search-icon').innerHTML = svg('search');
  $('btn-search-open').hidden = S.searchExpanded;
  $('search-box').hidden = !S.searchExpanded;
  $('search-input').setAttribute('aria-expanded', String(S.searchExpanded));
  const locked = (S.view === 'editing' || S.view === 'conflict');
  $('btn-menu').disabled = locked;
  $('btn-menu').classList.toggle('is-faint', locked);
  $('btn-more').hidden = (S.view === 'empty');
  $('btn-edit').hidden = !(S.view === 'reading');
  $('btn-edit').textContent = S.editBusy ? '读取中…' : '编辑';
  $('btn-edit').disabled = S.editBusy;
  const kicker = S.note ? S.note.split('/').slice(0,-1).join(' / ') : '';
  $('doc-kicker').textContent = kicker;
  $('doc-title').textContent = S.note ? S.note.split('/').pop().replace(/\.md$/,'') : '笔记';
  $('doc-title').style.fontFamily = 'var(--font-ui)';

  // 三个正文态
  $('v-empty').hidden = S.view !== 'empty';
  $('v-reading').hidden = S.view !== 'reading';
  $('v-editing').hidden = S.view !== 'editing';
  $('v-conflict').hidden = S.view !== 'conflict';
  if (S.view === 'empty') renderEmpty();
  const readSig = [S.readMode,S.note,S.hit].join('~');
  if (S.view === 'reading' && readSig !== lastReadSig) { renderReading(); lastReadSig = readSig; }
  if (S.view === 'editing') renderEditing();
  if (S.view === 'conflict') renderConflict();

  // 侧栏三块内容互斥。树只在数据真的变了才重画——打字时不许把整棵树推倒重来。
  $('p-tree').hidden = S.panel !== 'tree';
  $('p-search').hidden = S.panel !== 'search';
  $('p-settings').hidden = S.panel !== 'settings';
  $('btn-new').hidden = (S.panel === 'search' && !!S.query.trim());
  const tsig = [S.treeMode,S.note,S.selectedDir,layout(),S.stateId,[...S.expanded].sort().join('|')].join('~');
  if (S.panel === 'tree' && tsig !== lastTreeSig) { renderTree(); lastTreeSig = tsig; }
  if (S.panel === 'search') renderResults();
  if (S.panel === 'settings') renderSettings();

  renderOverlays(); renderToast(); renderNow(); tape();
}
function renderNow() {
  $('now-state').textContent = S.stateId + ' · ' + (STATE_NAME[S.stateId] || '主流程');
  document.querySelectorAll('.st-btn').forEach(b => b.classList.toggle('on', b.dataset.jump === S.stateId));
}
function tape() {
  if (!S.tape) return;
  document.querySelectorAll('#screen [data-tap]').forEach(el => {
    if (el.offsetParent === null) { el.removeAttribute('data-size'); return; }
    const r = el.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    el.dataset.size = w + '×' + h;
    el.classList.toggle('too-small', (w > 0 && w < 44) || (h > 0 && h < 44));
  });
}

/* ---------- 冲突 ---------- */
const FRAGS = [
  {id:'f1', local:'把「整库拉一遍」换成「按需取一篇」', remote:'把「整库拉一遍」换成「按需取一篇」'},
  {id:'f2', local:'手机上只看一篇、只写一篇。', remote:'手机上只看一篇、也只改这一篇。'},
  {id:'f3', local:'电脑上继续用本地库高频改。', remote:'电脑上继续用本地库高频改，手机不要碰整库。'}
];
function renderConflict() {
  let local = '', remote = '';
  FRAGS.forEach(f => {
    const diff = f.local !== f.remote;
    const d = S.conflict.decisions[f.id];
    const cls = diff ? (d === 'accept' ? 'acc' : d === 'reject' ? 'rej' : '') : '';
    const localCls = diff ? (cls || 'del') : '';
    const remoteCls = diff ? (cls || 'ins') : '';
    const mark = d === 'accept' ? '<em>采纳</em>' : d === 'reject' ? '<em>不采纳</em>' : '';
    if (diff) {
      local += '<span class="frag ' + localCls + '" data-act="frag" data-id="' + f.id + '">' + esc(f.local) + mark + '</span>\n';
      remote += '<span class="frag ' + remoteCls + '" data-act="frag" data-id="' + f.id + '">' + esc(f.remote) + mark + '</span>\n';
    } else {
      local += esc(f.local) + '\n'; remote += esc(f.remote) + '\n';
    }
  });
  const unresolved = FRAGS.filter(f => f.local !== f.remote && !S.conflict.decisions[f.id]).length;
  let bubble = '';
  if (S.conflict.activeFrag) {
    const f = FRAGS.find(x => x.id === S.conflict.activeFrag);
    const i = FRAGS.indexOf(f);
    bubble = '<div class="bubble" style="left:16px;top:' + (78 + i*30) + 'px">' +
      '<span style="font-size:12px;align-self:center">这一处</span>' +
      '<button data-act="decide" data-d="accept" data-tap>采纳</button>' +
      '<button data-act="decide" data-d="reject" data-tap>不采纳</button></div>';
  }
  $('conflict-scroll').innerHTML =
    '<div class="conflict-head">' + esc((S.note||'笔记').split('/').pop()) + ' · 冲突合并</div>' +
    '<div class="conflict-sub">提交冲突 · 左右对照 · 点差异裁决' +
      (S.conflict.sideWasOpen ? '　｜　侧栏在进来的那一刻自动收起并锁住，☰ 已置灰' : '') + '</div>' +
    '<div class="merge-cols">' +
      '<div class="merge-col"><div class="merge-col-head">本地版本（你的改动）</div><div class="merge-col-body">' + local + '</div></div>' +
      '<div class="merge-col"><div class="merge-col-head">远端版本（PC 改动）</div><div class="merge-col-body">' + remote + '</div></div>' +
    '</div>' + bubble +
    (unresolved ? '<div class="sheet-unresolved" style="margin-top:12px;border-radius:6px">还有 ' + unresolved + ' 处差异未处理</div>' : '');
  $('btn-preview').textContent = S.conflict.preview ? '收起预览' : '预览改动处理';
}

/* ---------- 树 ---------- */
function renderTree() {
  const p = $('p-tree');
  if (S.treeMode === 'loading-first') {
    p.innerHTML = '<div class="state-block"><p class="st-title">正在取全库名单…</p>' +
      '<p class="st-body">第一次打开要等一次整树请求，可能要几秒。目录还没到手，不是库里没有笔记。</p>' +
      '<div class="st-skel w80"></div><div class="st-skel w60"></div><div class="st-skel w80"></div></div>';
    return;
  }
  if (S.treeMode === 'loading-quick') {
    p.innerHTML = '<div class="state-block"><p class="st-title">正在核对版本…</p>' +
      '<p class="st-body">本机有名单，先问一次版本号就能还原。这一态一闪而过，不能跳布局。</p>' +
      '<div class="st-skel w80"></div><div class="st-skel w60"></div></div>';
    return;
  }
  if (S.treeMode === 'offline') {
    p.innerHTML = '<div class="state-block warn"><p class="st-title">' + svg('warning') + '连不上服务端</p>' +
      '<p class="st-body">连不上服务端，目录暂时显示不出来。本机那份名单要核对过版本才敢用，所以这里不画一棵可能是过期的树。</p>' +
      '<div class="btn-row"><button class="btn" data-act="retryTree" data-tap>重试</button></div></div>';
    return;
  }
  const expanded = new Set(S.expanded);
  if (S.note) {
    const parts = S.note.split('/');
    for (let i=1;i<parts.length;i++) expanded.add(parts.slice(0,i).join('/'));
  }
  let rows = '';
  function walk(node, depth) {
    const dirs = [...node.dirs.values()].sort((a,b)=>py(a.name,b.name));
    const notes = node.notes.slice().sort((a,b)=>py(a.name,b.name));
    for (const d of dirs) {
      const open = expanded.has(d.path);
      const pad = Math.min(depth,4) * 14;
      const sel = S.selectedDir === d.path;
      rows += '<button class="tree-row' + (sel?' is-selected':'') + '" data-act="toggleDir" data-path="' + esc(d.path) + '" data-tap ' +
        'style="padding-left:' + (12+pad) + 'px">' +
        (depth>=4 ? '<span class="deep-mark"></span>' : '') +
        svg(open?'chev-d':'chev-r','chev') + svg('folder','ficon') +
        '<span class="nm">' + esc(d.name) + '</span>' +
        '<span class="cnt">' + d.count + '</span>' +
        (layout()==='wide' ? '<span class="row-more" data-act="ops" data-tap>' + svg('more') + '</span>' : '') +
        '</button>';
      if (open) walk(d, depth+1);
    }
    for (const n of notes) {
      const pad = Math.min(depth,4) * 14;
      const cur = S.note === n.path;
      rows += '<button class="tree-row' + (cur?' is-current':'') + '" data-act="openNote" data-path="' + esc(n.path) + '" data-tap ' +
        'style="padding-left:' + (12+pad+20) + 'px">' +
        (depth>=4 ? '<span class="deep-mark"></span>' : '') +
        svg('note','ficon') + '<span class="nm">' + esc(n.name.replace(/\.md$/,'')) + '</span>' +
        (layout()==='wide' ? '<span class="row-more" data-act="ops" data-tap>' + svg('more') + '</span>' : '') +
        '</button>';
    }
  }
  walk(VAULT.root,0);
  p.innerHTML = '<div class="tree-meta"><span>笔记库根</span><span>' + TOTAL + ' 篇 · 最宽目录 197 篇 · 最深 4 层</span></div>' + rows;
  if (S.stateId === 'T-5') {
    const el = p.querySelector('.tree-row.is-current');
    if (el) setTimeout(() => { p.scrollTop = Math.max(0, el.offsetTop - p.clientHeight/2); }, 0);
  }
}

/* ---------- 搜索结果 ---------- */
function renderResults() {
  const p = $('p-search');
  const back = '<button class="panel-back" data-act="backToTree" data-tap>' + svg('back') + '返回目录</button>';
  const m = S.searchMode;
  if (m === 'checking' || m === 'offline' || m === 'none' || m === 'list-loading') {
    const copy = {
      checking:['正在确认网络…','搜索要先确认能问到版本身份，通常不到一秒。',''],
      offline:['连不上服务端','连不上服务端，搜索暂时用不了。恢复联网后再试。','warn'],
      none:['标题和路径里都没有','网络确认过、名单已到、确实没匹配，才能这么说。',''],
      'list-loading':['文件名单还在加载…','还没问到 ≠ 没有。名单到了会自己换成结果。','']
    }[m];
    p.innerHTML = back + '<div class="state-block ' + copy[2] + '"><p class="st-title">' + esc(copy[0]) + '</p>' +
      '<p class="st-body">' + esc(copy[1]) + '</p></div>';
    return;
  }
  const q = S.query.trim();
  const hits = q ? VAULT.paths.filter(x => x.toLowerCase().includes(q.toLowerCase())).sort(py) : [];
  let h = back + '<div class="tree-meta"><span>搜索结果 · 按路径序</span><span>' + hits.length + ' 条</span></div>';
  if (!q) h += '<div class="state-block"><p class="st-body">在上方输字，结果会就地替掉树；正文不动。</p></div>';
  hits.slice(0,60).forEach(x => {
    const name = x.split('/').pop().replace(/\.md$/,'');
    const dir = x.split('/').slice(0,-1).join(' / ');
    const mark = s => q ? esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'),'<span class="search-hit">$1</span>') : esc(s);
    h += '<button class="result-row" data-act="openResult" data-path="' + esc(x) + '" data-tap>' +
      '<span class="r-name">' + mark(name) + '</span><span class="r-path">' + mark(dir) + '</span></button>';
  });
  if (hits.length > 60) h += '<div class="tree-meta"><span>还有 ' + (hits.length-60) + ' 条，往下滚继续</span></div>';
  p.innerHTML = h;
}

/* ---------- 浮层 ---------- */
function renderOverlays() {
  const ov = $('ov-root'), modal = $('modal-root');
  const k = S.overlay;
  ov.hidden = !(k && ['ops','picker','sheet','discard','dirMissing'].includes(k));
  modal.hidden = !(k && ['new','rename','delete','move','nameClash','unlockInfo'].includes(k));
  $('unlock-root').hidden = !(k === 'unlock');
  if (!k) return;

  if (k === 'ops' || k === 'discard') {
    const t = k === 'discard' ? '放弃改动？' : (S.note ? S.note.split('/').pop() : '笔记');
    let h = '<div class="ov-mask" data-act="closeModal"></div><div class="sheet">' +
      '<div class="sheet-head">' + esc(t) + '</div>';
    if (k === 'discard') {
      h += '<div class="sheet-body" style="font-family:var(--font-ui)">写下的字会丢，草稿不再保留。</div>' +
        '<div class="sheet-foot"><div class="sheet-row">' +
        '<button class="btn" data-act="discardStay" data-tap>留在编辑态</button>' +
        '<button class="btn danger" data-act="discardGo" data-tap>放弃改动</button></div></div>';
    } else {
      const faint = (S.view==='editing'||S.view==='conflict');
      h += '<button class="op-row' + (faint?' is-faint':'') + '" data-act="fileOp" data-op="rename" data-tap style="' + (faint?'color:var(--color-text-faint)':'') + '">重命名</button>' +
        '<button class="op-row' + (faint?' is-faint':'') + '" data-act="fileOp" data-op="move" data-tap style="' + (faint?'color:var(--color-text-faint)':'') + '">移动</button>' +
        '<button class="op-row danger' + (faint?' is-faint':'') + '" data-act="fileOp" data-op="delete" data-tap style="' + (faint?'color:var(--color-text-faint)':'') + '">删除</button>' +
        '<hr class="op-sep"><button class="op-row" data-act="closeModal" data-tap>取消</button>';
      h += '</div>';
    }
    ov.innerHTML = h + '</div>';
    return;
  }
  if (k === 'sheet') {
    const unresolved = FRAGS.filter(f=>f.local!==f.remote && !S.conflict.decisions[f.id]).length;
    let preview = FRAGS.map(f => {
      const d = S.conflict.decisions[f.id];
      if (f.local === f.remote) return f.local;
      if (d === 'accept') return f.remote;
      if (d === 'reject') return f.local;
      return '[ 还有差异未处理 ] ' + f.local;
    }).join('\n');
    ov.innerHTML = '<div class="ov-mask" data-act="closePreview"></div><div class="sheet">' +
      '<div class="sheet-head">预览改动处理 · ' + esc((S.note||'笔记').split('/').pop()) + '</div>' +
      (unresolved ? '<div class="sheet-unresolved">处理完所有差异才能提交合并</div>' : '') +
      '<div class="sheet-body">' + esc(preview) + '</div>' +
      '<div class="sheet-foot"><div class="sheet-row">' +
        '<button class="btn primary" data-act="commitMerge" data-tap ' + (unresolved?'disabled':'') + '>提交合并</button>' +
        '<button class="btn" data-act="closePreview" data-tap>收起预览</button></div>' +
        '<div class="sheet-row"><button class="btn" data-act="saveCopy" data-tap>另存副本</button>' +
        '<button class="btn" data-act="keepLocal" data-tap>保留本地</button></div>' +
        '<div style="font-size:11px;color:var(--color-text-secondary)">keep-local / keep-remote 两种取舍在这一层里选，内容不改。</div>' +
      '</div></div>';
    return;
  }
  if (k === 'picker' || k === 'dirMissing') {
    const dirs = [...new Set(VAULT.paths.map(p=>p.split('/').slice(0,-1).join('/')).filter(Boolean))]
      .filter(d => !d.startsWith('08_BotSpace')).slice(0,14).sort(py);
    let list = '<button class="picker-row" data-act="pickerUp" data-tap>上一级</button>';
    dirs.forEach(d => list += '<button class="picker-row" data-act="pickerEnter" data-path="' + esc(d) + '" data-tap>' + esc(d) + ' ／</button>');
    list += '<div style="padding:10px;font-size:12px;color:var(--color-text-faint)">（没有子目录）</div>';
    ov.innerHTML = '<div class="ov-mask" data-act="closeModal"></div><div class="sheet">' +
      '<div class="sheet-head">' + (k==='dirMissing' ? '指定的目录不在了' : '移动到… / 就放这里：' + esc(S.pickerDir||'笔记库根')) + '</div>' +
      (k==='dirMissing' ? '<div class="sheet-body" style="font-family:var(--font-ui)">指定的目录不在了。可以改通用路径，或者只改这一次。</div>' : '') +
      '<div class="picker-list">' + list + '</div>' +
      '<div class="sheet-foot"><div class="sheet-row">' +
        '<button class="btn" data-act="goSettingsDir" data-tap>去设置改通用路径</button>' +
        '<button class="btn primary" data-act="pickerHere" data-tap>就放这里</button></div></div></div>';
    return;
  }

  // 模态弹窗：只改标题/说明/按钮，#dialog-input 是常驻节点
  const input = $('dialog-input');
  const needInput = ['new','rename','move'].includes(k);
  input.hidden = !needInput;
  $('modal-title').textContent = ({
    new:'新建笔记', rename:'重命名', delete:'删除「' + (S.note?S.note.split('/').pop():'笔记') + '」？',
    move:'移动到…', nameClash:'新建笔记', unlockInfo:'需要访问密码'
  })[k];
  const defaultDir = S.settings.target === 'fixed' ? S.settings.fixedDir : (S.selectedDir || '笔记库根');
  const dir = S.dialogDir || defaultDir;
  if (k === 'new') {
    input.placeholder = '只填名字，自动补 .md';
    $('modal-content').innerHTML = '<p class="field-label">放在 ' + esc(dir) + '。只填名字，路径由选中的文件夹决定。</p>' +
      '<div class="dir-field"><input type="text" id="dialog-dir" value="' + esc(dir) + '" readonly aria-label="目录" style="flex:1">' +
      '<button class="btn small" data-act="pickDir" data-tap>改目录</button></div>' +
      '<div id="new-err"></div>';
    $('modal-btns').innerHTML = '<button class="btn" data-act="closeModal" data-tap>取消</button>' +
      '<button class="btn primary" data-act="submitNew" data-tap>新建</button>';
  } else if (k === 'rename' || k === 'move') {
    input.placeholder = '名字';
    $('modal-content').innerHTML = '<p class="field-label">' + (k==='rename' ? '只改名字，还放在 ' + esc(dir) + '。' : '名字 + 已填好的目录，目录就在弹窗里改。') + '</p>' +
      (k==='rename' ? '<p style="font-size:13px;line-height:1.7">别的笔记里指向「' + esc((S.note||'').split('/').pop()) + '」的链接会断——本端只认得文件名，读不到别的笔记的正文，改不了那些链接，也报不出断了几条。</p>'
        : '<div class="dir-field"><input type="text" id="dialog-dir" value="' + esc(dir) + '" readonly aria-label="目录" style="flex:1"><button class="btn small" data-act="pickDir" data-tap>改目录</button></div>');
    $('modal-btns').innerHTML = '<button class="btn" data-act="closeModal" data-tap>取消</button>' +
      '<button class="btn primary" data-act="submitOp" data-tap>确定</button>';
  } else if (k === 'delete') {
    $('modal-content').innerHTML = '<p>删掉就没了，不进回收站，也别处没有副本。删完屏幕下方会给一次<strong>撤销</strong>，那一下能把原内容照原样放回去。</p>';
    $('modal-btns').innerHTML = '<button class="btn" data-act="closeModal" data-tap>取消</button>' +
      '<button class="btn danger" data-act="confirmDelete" data-tap>删除</button>';
  } else if (k === 'nameClash') {
    $('modal-content').innerHTML = '<p class="err-line" id="new-err">这个名字已经有了</p>' +
      '<p>不自动加后缀，也不把名字改掉。换个名字再试。</p>';
    $('modal-btns').innerHTML = '<button class="btn" data-act="closeModal" data-tap>取消</button>' +
      '<button class="btn primary" data-act="retryNew" data-tap>换个名字</button>';
  } else if (k === 'unlockInfo') {
    $('modal-content').innerHTML = '<p>颜色在解锁框出现之前已经按存档生效；框里不给切换主题的入口。</p>';
    $('modal-btns').innerHTML = '<button class="btn primary" data-act="closeModal" data-tap>知道了</button>';
  }
  $('modal-extra').innerHTML = '';
}

/* ---------- 提示条 ---------- */
function toast(text, action, dur, sticky) {
  if (S.toast && S.toast.sticky && !sticky) return; // 真送不到不许被顶掉
  clearTimeout(toastTimer);
  S.toast = { text, action, sticky:!!sticky };
  renderToast();
  if (!sticky) toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, dur || 2500);
}
function renderToast() {
  const t = $('toast');
  t.hidden = !S.toast;
  if (!S.toast) return;
  t.innerHTML = '<span>' + esc(S.toast.text) + '</span>' +
    (S.toast.action ? '<button data-act="toastAction" data-tap>' + esc(S.toast.action.label) + '</button>' : '');
}

/* =========================================================================
   交互：主干流程真点得通
   ========================================================================= */
function setSide(open) {
  S.sideOpen = open;
  if (open && S.network === 'off') S.treeMode = 'offline';
  if (open && S.network !== 'off' && S.treeMode === 'offline') S.treeMode = 'ready';
  if (!open && S.panel === 'search' && !S.query.trim()) S.panel = 'tree';
  if (!open && !S.query.trim()) S.searchExpanded = false;
  render();
}
function openNote(path, fromSearch) {
  S.note = path; S.view = 'reading';
  S.readMode = (S.network === 'off' ? 'offline' : 'loading');
  S.hit = !!fromSearch;
  S.recentMode = S.recentMode === 'none' ? 'normal' : S.recentMode;
  if (S.panel === 'settings') S.panel = 'tree';
  if (layout() === 'phone') S.sideOpen = false;
  $('v-reading').scrollTop = 0;
  S.stateId = fromSearch ? 'S-0' : 'R-1';
  render();
  // R-1 → 正文到手
  setTimeout(() => {
    if (S.view === 'reading' && S.readMode === 'loading') { S.readMode = 'ok'; render(); }
  }, 320);
}
function enterEdit() {
  if (S.view !== 'reading') return;
  S.editBusy = true; S.stateId = 'F-7'; render();
  setTimeout(() => {
    S.editBusy = false;
    if (S.network === 'off') { toast('连不上服务端，先别写。恢复联网后再试。', null, 2500); return; }
    S.view = 'editing'; S.dirty = false; S.stateId = 'W-1';
    const ta = $('editor-input'); ta.value = NOTE_MD.replace(/^---[\s\S]*?---\n\n/,''); ta.dataset.seeded = '1';
    ta.scrollTop = 0; render();
  }, 600);
}
function doSave() {
  const r = S.network === 'off' ? 'offline' : S.saveResult;
  S.editBusy = true; S.stateId = 'W-4'; render();
  setTimeout(() => {
    S.editBusy = false;
    if (r === 'offline') { toast('连不上服务端，没保存成。恢复联网后再试。', null, 8000); render(); return; }
    if (r === 'missing') { toast('这篇不在了，可能被改名或删掉了。', null, 8000); render(); return; }
    if (r === 'conflict') {
      S.conflict.decisions = {}; S.conflict.preview = false; S.conflict.activeFrag = null;
      S.conflict.sideWasOpen = S.sideOpen || (layout()==='wide' && !S.sideCollapsed);
      S.sideOpen = false;
      S.view = 'conflict'; S.stateId = 'C-1'; render(); return;
    }
    S.view = 'reading'; S.dirty = false; S.readMode = 'ok'; S.stateId = 'F-8';
    render(); toast('已保存');
  }, 650);
}
function askDiscard() {
  if (!S.dirty) { S.view='reading'; S.stateId='F-9'; render(); return; }
  S.overlay = 'discard'; S.stateId = 'W-3'; render();
}
function toggleDir(path) {
  if (S.expanded.has(path)) S.expanded.delete(path); else S.expanded.add(path);
  S.selectedDir = path; S.stateId = (path === '日记归档' ? 'T-6' : 'T-4'); render();
}
function onSearchInput() {
  S.searchExpanded = true;
  S.query = $('search-input').value;
  if (S.query.trim()) {
    S.panel = 'search';
    const q = S.query.trim();
    S.searchMode = S.network === 'off' ? 'offline'
      : (VAULT.paths.some(x=>x.toLowerCase().includes(q.toLowerCase())) ? 'results' : 'none');
    S.stateId = S.network === 'off' ? 'S-2' : (S.searchMode === 'results' ? 'S-0' : 'S-3');
  } else { S.panel = 'tree'; }
  render();  // 不重建 #search-input，也不写它的 value
}

/* ---------- 状态清单：41 态逐个可跳 ---------- */
function applyState(id) {
  // 每一态都是一个完整、自洽的状态组合，不是半截画面
  const base = () => {
    S.sideOpen = false; S.sideCollapsed = false; S.panel = 'tree'; S.searchExpanded = false; S.view = 'empty';
    S.note = null; S.recentMode = 'normal'; S.readMode = 'ok'; S.treeMode = 'ready';
    S.searchMode = 'results'; S.query = ''; $('search-input').value = '';
    S.overlay = null; S.toast = null; S.dirty = false; S.editBusy = false;
    clearTimeout(toastTimer);
    S.network='on'; S.saveResult='ok'; S.clashOnNew='no'; S.dialogDir=''; S.modalKind='new';
    $('sim-net').value='on'; $('sim-save').value='ok'; $('sim-clash').value='no';
    S.hit = false; S.settings.target = 'selected'; S.settings.fixedDir = '03_Projects/笔记系统';
    S.expanded = new Set(['03_Projects','03_Projects/笔记系统']);
    S.selectedDir = '03_Projects/笔记系统';
    S.conflict = {decisions:{},preview:false,activeFrag:null,sideWasOpen:false,bubbleAt:null};
    S.viewport = 'phone'; $('vp').value = 'phone'; applyViewport();
    S.keyboard = false; $('kb-btn').textContent = '模拟键盘：关'; applyKeyboard();
    S.tape = false; $('tape-btn').textContent = '尺寸标注：关';
    ['v-empty','v-reading','v-editing','v-conflict','p-tree','p-search','p-settings']
      .forEach(k => { const el = $(k); if (el) el.scrollTop = 0; });
    $('editor-input').scrollTop = 0;
  };
  const openSide = (panel) => { S.sideOpen = true; S.panel = panel||'tree'; S.searchExpanded = panel === 'search'; };
  base(); S.stateId = id;
  switch (id) {
    case 'T-1': openSide(); S.treeMode = 'loading-first'; break;
    case 'T-2': openSide(); S.treeMode = 'loading-quick'; break;
    case 'T-3': openSide(); S.treeMode = 'offline'; break;
    case 'T-4': openSide(); break;
    case 'T-5': S.note = DEMO_NOTE; S.view='reading'; openSide(); S.expanded.add('03_Projects'); S.expanded.add('03_Projects/笔记系统'); break;
    case 'T-6': openSide(); S.expanded = new Set(['日记归档']); S.selectedDir='日记归档'; break;
    case 'S-1': openSide('search'); S.query='同步'; $('search-input').value='同步'; S.searchMode='checking'; break;
    case 'S-2': openSide('search'); S.query='同步'; $('search-input').value='同步'; S.searchMode='offline'; $('sim-net').value='off'; S.network='off'; break;
    case 'S-3': openSide('search'); S.query='绝不可能有的词'; $('search-input').value='绝不可能有的词'; S.searchMode='none'; break;
    case 'S-4': openSide('search'); S.query='同步'; $('search-input').value='同步'; S.searchMode='list-loading'; break;
    case 'S-0': openSide('search'); S.query='同步'; $('search-input').value='同步'; S.searchMode='results'; break;
    case 'P-1': openSide('settings'); break;
    case 'P-2': openSide('settings'); S.settings.target='fixed'; break;
    case 'P-3': openSide('settings'); S.settings.target='fixed'; S.settings.fixedDir='03_Projects/已改名的旧目录'; break;
    case 'O-1': openSide(); S.note=DEMO_NOTE; S.view='reading'; S.overlay='ops'; break;
    case 'O-2': S.viewport='wide'; $('vp').value='wide'; applyViewport(); S.sideOpen=true; S.note=DEMO_NOTE; S.view='reading'; break;
    case 'O-3': openSide(); S.overlay='new'; $('dialog-input').value=''; break;
    case 'O-4': openSide(); S.overlay='picker'; break;
    case 'O-5': openSide(); S.note=DEMO_NOTE; S.view='reading'; S.overlay='delete'; break;
    case 'O-5b': openSide(); S.note=DEMO_NOTE; S.view='reading'; S.overlay='rename';
      $('dialog-input').value='移动端同步方案'; break;
    case 'O-5c': openSide(); S.note=DEMO_NOTE; S.view='reading'; S.overlay='move';
      $('dialog-input').value='移动端同步方案.md'; break;
    case 'O-6': openSide(); S.overlay='nameClash'; break;
    case 'E-1': S.recentMode='none'; break;
    case 'E-2': break;
    case 'E-3': S.recentMode='invalid'; break;
    case 'E-4': S.recentMode='invalid-clicked';
      S.toast = {text:'这篇不在了，可能被改名或删掉了', action:{label:'从列表里去掉',kind:'removeRecent'}, sticky:false};
      break;
    case 'R-1': S.note=DEMO_NOTE; S.view='reading'; S.readMode='loading'; break;
    case 'R-2': S.note=DEMO_NOTE; S.view='reading'; S.readMode='pending'; break;
    case 'R-3': S.note=DEMO_NOTE; S.view='reading'; S.readMode='missing'; break;
    case 'R-4': S.note=DEMO_NOTE; S.view='reading'; S.readMode='offline'; break;
    case 'R-4b': S.note=DEMO_NOTE; S.view='reading'; S.readMode='offline'; S.overlay='unlock'; break;
    case 'W-1': S.note=DEMO_NOTE; S.view='editing'; S.dirty=false; break;
    case 'W-2': S.note=DEMO_NOTE; S.view='editing'; S.dirty=true; S.keyboard=true;
      $('kb-btn').textContent='模拟键盘：开'; applyKeyboard(); break;
    case 'W-3': S.note=DEMO_NOTE; S.view='editing'; S.dirty=true; S.overlay='discard'; break;
    case 'W-4': S.note=DEMO_NOTE; S.view='editing'; S.dirty=true; S.editBusy=true; $('sim-save').value='offline'; S.saveResult='offline'; break;
    case 'C-1': S.note=DEMO_NOTE; S.view='conflict'; break;
    case 'C-2': S.note=DEMO_NOTE; S.view='conflict'; break;
    case 'C-3': S.note=DEMO_NOTE; S.view='conflict'; S.overlay='sheet'; break;
    case 'C-4': S.note=DEMO_NOTE; S.view='conflict'; S.conflict.decisions={f2:'accept'}; break;
    case 'C-0': S.note=DEMO_NOTE; S.view='conflict'; S.sideOpen=true; S.conflict.sideWasOpen=true; break;
    case 'G-1': S.toast={text:'已保存',action:null,sticky:false}; break;
    case 'G-2': S.toast={text:'已删除 移动端同步方案.md',action:{label:'撤销',kind:'undo'},sticky:false}; break;
    case 'G-3': S.toast={text:'还没送到，联网后自动再试',action:null,sticky:false}; break;
    case 'G-4': S.toast={text:'日记归档/2026-02-05.md 的勾选送不到了',action:{label:'打开',kind:'openFailed'},sticky:true}; break;
    case 'G-5': S.overlay='unlock'; break;
    case 'G-6': S.viewport='wide'; $('vp').value='wide'; applyViewport(); S.sideCollapsed=true; break;
  }
  render();
}

   演示开关

const VPS = { phone:[390,844,'手机'], wide:[1280,800,'宽屏'], land:[844,390,'手机横屏'],
  bp899:[899,800,'断点下 899（仍是滑出）'], bp900:[900,800,'断点上 900（改为常驻）'] };
function applyViewport() {
  const [w,h,label] = VPS[S.viewport];
  $('stage').style.width = w+'px'; $('stage').style.height = h+'px';
  $('stage-tag').textContent = w+' × '+h+' · '+label;
}
function applyKeyboard() {
  $('stage').style.setProperty('--keyboard-h', S.keyboard ? '300px' : '0px');
  $('fake-keyboard').hidden = !S.keyboard;
}
function buildDrawer() {
  let h = '';
  STATES.forEach(group => {
    h += '<h4>' + group[0] + ' · ' + esc(group[1]) + '</h4>';
    group[2].forEach(s => {
      h += '<button class="st-btn" data-jump="' + s[0] + '"><span class="sid">' + s[0] + '</span>' + esc(s[1]) +
        '<br><span class="sdesc">' + esc(s[2]) + '</span></button>';
    });

/* =========================================================================
   节点存活监视器：证明「打字那个输入框没被换掉」
   ========================================================================= */
const PERSISTENT = ['search-input','editor-input','dialog-input','unlock-input'];
const REFS = {}; let compCount = 0, compOpen = false, nodeBroken = false;
function initMonitor() {
  PERSISTENT.forEach(id => { REFS[id] = $(id); REFS[id].dataset.stamp = id + '-once'; });
  PERSISTENT.forEach(id => {
    const el = $(id);
    el.addEventListener('compositionstart', () => { compOpen = true; compCount++; showMonitor(); });
    el.addEventListener('compositionend', () => { compOpen = false; showMonitor(); });
  });
  // 每次 render 之后核对：节点还是不是同一个对象
  const orig = window.render;
  window.render = function () { orig(); checkNodes(); };
  showMonitor();
}
function checkNodes() {
  PERSISTENT.forEach(id => { if ($(id) !== REFS[id] || !$(id).dataset.stamp) nodeBroken = true; });
  showMonitor();
}
function showMonitor() {
  const m = $('node-monitor');
  m.textContent = '｜ 输入节点：' + (nodeBroken ? '被换掉了（不合格）' : '4/4 全程同一个') +
    ' · 拼音组字 ' + compCount + ' 次' + (compOpen ? '（组字进行中）' : '') +
    (nodeBroken ? '' : ' · 未中断');
  m.classList.toggle('bad', nodeBroken);
}

/* =========================================================================
   事件：全部委托，避免重建节点后监听丢失
   ========================================================================= */
document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { applyState(jump.dataset.jump); $('drawer').classList.remove('open'); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const stop = ev => { ev.preventDefault(); ev.stopPropagation(); };
  switch (act) {
    case 'toggleSide':
      if (S.view==='editing'||S.view==='conflict') { toast('先保存或取消，再看别的', null, 2500); return; }
      if (layout()==='wide') { S.sideCollapsed = !S.sideCollapsed; S.stateId = S.sideCollapsed?'G-6':'T-4'; render(); }
      else setSide(!S.sideOpen);
      break;
    case 'closeSide':
      if (layout()==='wide') { S.sideCollapsed=true; S.stateId='G-6'; render(); }
      else setSide(false);
      break;
    case 'openSettings': S.panel='settings'; S.stateId='P-1'; render(); break;
    case 'searchOpen': {
      // 展开搜索：只切可见性，输入框节点自始至终是同一个
      S.searchExpanded = true;
      S.panel = S.query.trim() ? 'search' : 'tree';
      S.stateId = 'T-4'; render();
      const inp = $('search-input');
      if (inp) { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
      break;
    }
    case 'clearSearch': {
      // 清空：只改内容，节点、焦点、键盘都留在原处
      const inp = $('search-input');
      if (!inp) break;
      inp.value = '';
      S.query = '';
      S.panel = 'tree';
      S.stateId = 'T-4';
      render();
      inp.focus();
      break;
    }
    case 'backToTree': S.panel='tree'; S.query=''; S.searchExpanded=false; $('search-input').value=''; S.stateId='T-4'; render(); break;
    case 'toggleDir': toggleDir(el.dataset.path); break;
    case 'openNote': openNote(el.dataset.path); break;
    case 'openResult': openNote(el.dataset.path, true); break;
    case 'openRecent': {
      const i = +el.dataset.i, r = RECENT[i];
      const bad = (S.recentMode==='invalid'||S.recentMode==='invalid-clicked') && i===4;
      if (bad) { S.stateId='E-4'; toast('这篇不在了，可能被改名或删掉了',{label:'从列表里去掉',kind:'removeRecent'},8000); S.recentMode='invalid-clicked'; render(); }
      else openNote(r.path);
      break;
    }
    case 'retryRead': S.readMode = S.network==='off'?'offline':'ok'; S.stateId='R-4'; render(); break;
    case 'showUnlock': S.overlay='unlock'; S.stateId='G-5'; render(); break;
    case 'retryTree': S.treeMode = S.network==='off'?'offline':'ready'; S.stateId='T-3'; render();
      if (S.network!=='off') setTimeout(()=>{S.treeMode='ready';S.stateId='T-4';render();},500); break;
    case 'edit': enterEdit(); break;
    case 'exitEdit': case 'cancelEdit': askDiscard(); break;
    case 'save': doSave(); break;
    case 'taskCheck': {
      const box = el; box.classList.toggle('is-done');
      box.textContent = box.classList.contains('is-done') ? '✓' : '';
      toast('还没送到，联网后自动再试'); S.stateId='G-3'; renderNow();
      break;
    }
    case 'ops': S.overlay='ops'; S.stateId='O-1'; render(); break;
    case 'newNote': {
      S.overlay='new'; S.modalKind='new'; S.stateId='O-3';
      render(); $('dialog-input').value=''; $('dialog-input').focus();
      if (S.settings.target==='fixed' && S.settings.fixedDir.includes('已改名')) {
        setTimeout(()=>{ S.overlay='dirMissing'; render(); },10);
      }
      break;
    }
    case 'pickDir': S.overlay='picker'; S.pickerDir=S.selectedDir; render(); break;
    case 'pickerEnter': S.pickerDir=el.dataset.path; render(); break;
    case 'pickerUp': S.pickerDir=''; render(); break;
    case 'pickerHere': {
      const d = S.pickerDir || '笔记库根';
      S.dialogDir = d;
      const back = ['new','rename','move'].includes(S.modalKind) ? S.modalKind : null;
      S.overlay = back; render();
      if (!back) toast('已放到 ' + d);
      break;
    }
    case 'goSettingsDir': S.overlay=null; S.panel='settings'; S.sideOpen=true; S.settings.target='fixed'; S.stateId='P-2'; render(); break;
    case 'submitNew': {
      const name = $('dialog-input').value.trim();
      if (!name) { $('new-err').textContent='先填个名字'; return; }
      if (S.clashOnNew==='yes') { S.overlay='nameClash'; S.stateId='O-6'; render(); return; }
      const dir = ($('dialog-dir') && $('dialog-dir').value) || S.selectedDir || '笔记库根';
      S.note = dir + '/' + name.replace(/\.md$/,'') + '.md';
      S.overlay=null; S.sideOpen=false; S.view='editing'; S.dirty=false; S.stateId='F-6';
      $('editor-input').value='# ' + name + '\n\n'; $('editor-input').dataset.seeded='1';
      render(); toast('已新建 ' + name);
      break;
    }
    case 'retryNew': S.overlay='new'; S.stateId='O-3'; render(); $('dialog-input').value=''; $('dialog-input').focus(); break;
    case 'fileOp': {
      const op = el.dataset.op;
      if (S.view==='editing'||S.view==='conflict') { S.overlay=null; render(); toast('先保存或取消，再改文件'); return; }
      S.overlay = op==='delete'?'delete':op; S.modalKind = op; S.stateId='O-5';
      render();
      if (op==='rename'||op==='move') $('dialog-input').value = (S.note||'').split('/').pop().replace(/\.md$/,'');
      break;
    }
    case 'submitOp': S.overlay=null; render(); toast('已保存'); break;
    case 'confirmDelete': {
      const deleted = (S.note||'这篇').split('/').pop();
      S.overlay=null; S.view='empty'; S.note=null; S.stateId='F-11'; render();
      toast('已删除 ' + deleted, {label:'撤销',kind:'undo'}, 8000); break;
    }
    case 'discardStay': S.overlay=null; S.stateId='W-3'; render(); break;
    case 'discardGo': S.overlay=null; S.view='reading'; S.dirty=false; S.stateId='F-9'; render(); break;
    case 'theme':
      S.settings.theme = el.dataset.v; $('theme-sel').value = el.dataset.v;
      try { localStorage.setItem('gitobsidianlite.theme', el.dataset.v); } catch(_){}
      S.stateId='P-1'; render(); break;
    case 'target': S.settings.target=el.dataset.v; S.stateId = el.dataset.v==='fixed'?'P-2':'P-1'; render(); break;
    case 'frag': S.conflict.activeFrag = el.dataset.id; S.stateId='C-1'; render(); break;
    case 'decide':
      if (S.conflict.activeFrag) S.conflict.decisions[S.conflict.activeFrag] = el.dataset.d;
      S.conflict.activeFrag=null; render(); break;
    case 'preview':
      S.conflict.preview=!S.conflict.preview;
      S.overlay = S.conflict.preview ? 'sheet' : null; S.stateId='C-3'; render(); break;
    case 'closePreview': S.conflict.preview=false; S.overlay=null; S.stateId='C-2'; render(); break;
    case 'commitMerge': S.overlay=null; S.conflict.preview=false; S.view='reading'; S.stateId='F-10'; render(); toast('合并已保存'); break;
    case 'saveCopy': case 'keepLocal': S.overlay=null; render(); toast('已保留本地版本，远端存为 .conflict.md'); break;
    case 'conflictBack': S.view='editing'; S.stateId='C-4'; render(); break;
    case 'closeModal': S.overlay=null; render(); break;
    case 'unlock': S.overlay=null; render(); toast('已解锁'); break;
    case 'toastAction': {
      const k = S.toast && S.toast.action && S.toast.action.kind;
      S.toast=null; renderToast();
      if (k==='undo') toast('已撤销');
      if (k==='removeRecent') toast('已从列表里去掉');
      if (k==='openFailed') openNote('日记归档/2026-02-05.md');
      break;
    }
  }
});
// 长按：窄屏树行
let lpTimer = null;
$('screen').addEventListener('pointerdown', e => {
  const row = e.target.closest('.tree-row');
  if (!row || layout()==='wide' || !row.dataset.path || row.dataset.act!=='openNote') return;
  lpTimer = setTimeout(() => { S.overlay='ops'; S.stateId='O-1'; render(); }, 480);
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  $('screen').addEventListener(ev, () => clearTimeout(lpTimer)));
// 输入：搜索框与编辑区都是常驻节点；打字期间不重写 value
$('search-input').addEventListener('input', onSearchInput);
$('editor-input').addEventListener('input', () => { S.dirty = true; $('edit-hint').textContent = '有改动未保存'; });
$('search-input').addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); } });
// 演示开关
$('vp').addEventListener('change', e => { S.viewport=e.target.value; applyViewport(); render(); });
$('theme-sel').addEventListener('change', e => {
  S.settings.theme=e.target.value;
  try { localStorage.setItem('gitobsidianlite.theme', e.target.value); } catch(_){}
  render();
});
$('kb-btn').addEventListener('click', () => {
  S.keyboard=!S.keyboard; $('kb-btn').textContent='模拟键盘：'+(S.keyboard?'开':'关');
  applyKeyboard(); render();
});
$('tape-btn').addEventListener('click', () => {
  S.tape=!S.tape; $('tape-btn').textContent='尺寸标注：'+(S.tape?'开':'关'); render();
});
$('drawer-btn').addEventListener('click', () => $('drawer').classList.toggle('open'));
$('drawer-close').addEventListener('click', () => $('drawer').classList.remove('open'));
$('sim-save').addEventListener('change', e => S.saveResult=e.target.value);
$('sim-net').addEventListener('change', e => { S.network=e.target.value; });
$('sim-clash').addEventListener('change', e => S.clashOnNew=e.target.value);
// 系统返回键：侧栏开着先收侧栏；编辑态退出编辑；冲突态退回编辑
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.overlay) { S.overlay=null; render(); return; }
  if (S.sideOpen && layout()==='phone') { setSide(false); return; }
  if (S.view==='conflict') { S.view='editing'; render(); return; }
  if (S.view==='editing') { askDiscard(); return; }
  if (S.view==='reading') { S.view='empty'; S.note=null; render(); }
});

/* 启动 */
buildDrawer(); applyViewport(); applyKeyboard(); initMonitor();
try {
  const saved = localStorage.getItem('gitobsidianlite.theme');
  if (saved) { S.settings.theme = saved; $('theme-sel').value = saved; }
} catch(_){}
applyState('E-2');
</script>
